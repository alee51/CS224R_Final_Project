# Stage 3a smoke — minority_cot advantage estimator, Qwen3-1.7B-Base, Polaris-51K
#
# Reward stack (LOCKED, unchanged from Stage 2): docs/reward-decision.md —
# MathReward (math.py) via patched router (polaris → math.compute_score).
# Prompt suffix from maxrl polaris preprocess.  No custom_reward_function.path.
#
# algorithm.adv_estimator: minority_cot
#   Invokes compute_minority_cot_outcome_advantage registered via
#   @register_adv_est(AdvantageEstimator.MINORITY_COT) in the patched
#   verl/trainer/ppo/core_algos.py (infra/patches/maxrl_minority_cot_adv_est.patch).
#   This is NOT adv_estimator: maxrl (paper method, out of scope per migration plan §10).
#   This is NOT adv_estimator: grpo (Stage 2 baseline).
#
# algorithm.minority_cot.n_clusters / seed / global_seed
#   These are MOCK-ONLY knobs for Stage 3a.  Stage 3b will replace them with a
#   judge: block once the real LLM judge service is up (Stage 4).  The objective
#   hook code (compute_minority_cot_outcome_advantage) is unchanged between 3a and 3b;
#   only the cluster-ID source swaps (assign_mock_clusters → assign_judge_clusters).
#
# KL=0 + loss_agg_mode=token-mean: carried forward from Stage 2 (migration plan §1).
#   norm_adv_by_std_in_grpo: true is harmless for minority_cot (consumed only by GRPO path).
#
# Parquet paths: reused from Stage 2, already uploaded to /vol/data/main-verl/.
#   Do NOT re-upload; schema unchanged.
#
# B200 micro-batch ladder: carried verbatim from Stage 2 final config (S2.6 handoff).
#   ppo_micro_batch_size_per_gpu=4, gpu_memory_utilization=0.45, max_prompt_length=1024,
#   data.truncation=left — do not re-tune here.
#
# W&B tag rule: verl (REQUIRED for all main-verl runs) + stage-03a + minority_cot
#   + smoke + mock_clusters.  The mock_clusters tag is critical: Stage 3b runs
#   (real judge) will use real_judge instead, enabling W&B post-hoc filtering.
#
# TODOs:
#   <!-- TODO --> algorithm.minority_cot.n_clusters — confirm 4 is right once
#     we see train/distinct_clusters distribution at step 25.  Bump to 8 if median < 2.
#   <!-- TODO --> algorithm.minority_cot.global_seed — bump to spot-check tiebreak
#     sensitivity in a follow-up run.

hydra:
  searchpath:
    - file:///root/maxrl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: /vol/data/main-verl/polaris_train.parquet
  val_files: /vol/data/main-verl/polaris_val.parquet
  train_batch_size: 128
  max_prompt_length: 1024
  max_response_length: 4096
  # left-truncation preserves the \boxed{} instruction suffix at prompt tail —
  # critical for MathReward parsing.  Inherited from Stage 2 attempt 7 fix.
  truncation: left

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-1.7B-Base
  actor:
    fsdp_config:
      model_dtype: bfloat16
    ppo_mini_batch_size: 32
    ppo_epochs: 1
    use_kl_loss: false
    loss_agg_mode: token-mean
    ppo_micro_batch_size_per_gpu: 4
  rollout:
    name: vllm
    n: 8  # N_ROLLOUTS=8 required by minority_cot marginal kernel
    enforce_eager: true
    gpu_memory_utilization: 0.45
    log_prob_micro_batch_size_per_gpu: 4
    tensor_model_parallel_size: 1
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      model_dtype: bfloat16

algorithm:
  adv_estimator: minority_cot     # was: grpo in Stage 2. NOT maxrl (paper method).
  use_kl_in_reward: false          # carry forward from Stage 2
  norm_adv_by_std_in_grpo: true    # carry forward (harmless for minority_cot path)
  minority_cot:                    # mock-only sub-block; Stage 3b replaces with judge:
    n_clusters: 4                  # mock cluster count; upper end of Stage 4 forced-k range
    seed: 0                        # mock hash seed; reproducibility gate for unit tests
    global_seed: 0                 # rng seed for rarest-cluster tiebreak

reward_model:
  enable: false

trainer:
  nnodes: 1
  n_gpus_per_node: 4
  total_training_steps: 10  # Stage 3a early-validation: 10-step smoke to confirm hook fires + advantage distribution differs from GRPO; 50-step locked-in run runs at Stage 8.
  test_freq: 25             # skipped in 10 steps; val signal isn't what's being validated here
  save_freq: 10             # one checkpoint at end (otherwise none, given save_freq>total_steps)
  log_val_generations: 10
  logger: [console, wandb]
  project_name: cs224r-minority-voting
  experiment_name: minority_cot_smoke_1p7b
  default_local_dir: /vol/checkpoints/main-verl/minority_cot_smoke_1p7b

+trainer.wandb_kwargs:
  entity: 224r-project
  tags: [verl, stage-03a, minority_cot, smoke, mock_clusters]

ray_init:
  ray_dir: /tmp/ray

+ray_kwargs:
  ray_init:
    num_gpus: 4
