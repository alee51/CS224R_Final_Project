# Stage 4 S4.6 — judge latency smoke (concurrent fan-out).
#
# Single cluster_batch_sync pass; gate on mean wall time per task.
# Use judge_latency_smoke_serial.yaml to isolate parse rate vs concurrency.
#
# Run: ./main-verl/scripts/launch_judge_latency.sh

judge:
  base_url: https://chicken602--v1-chat-completions.modal.run
  model: Qwen/Qwen2.5-7B-Instruct
  concurrency: 8
  max_tokens: 4096
  temperature: 0.0
  timeout_s: 120

smoke:
  n_tasks: 64
  n_rollouts: 8
  seed: 42
  task_template: product

gates:
  mean_wall_per_task_s_max: 2.0
  # Not enforced yet — S4.6 passed latency at 22% parse under load; see stage-04-log.md
  parse_ok_rate_min: null
