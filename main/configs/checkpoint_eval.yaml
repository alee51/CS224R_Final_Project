# Offline rollout eval: base vs training checkpoints on a fixed prompt slice.
# Launch: bash main/scripts/launch_checkpoint_eval.sh

operator: nancy
gpu_class: H200
global_seed: 42
prompt_variant: hybrid_answer_boxed

eval:
  data_path: /vol/data/polaris_train.jsonl
  n_batches: 2
  batch_size: 64
  n_rollouts: 8
  checkpoint_dir: /vol/checkpoints/train_real/
  # Steps to compare (base + these checkpoints).
  checkpoint_steps: [49, 99, 149]
  output_dir: /vol/probes/checkpoint_eval

rollout:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  temperature: 1.0
  top_p: 1.0
  gpu_memory_utilization: 0.45
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true
  logprobs: 1

train:
  lr: 1.0e-6
  weight_decay: 0.0
  gradient_checkpointing: false

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
