# Production training config (H200, train.batch_size=64 locked).
# Shared train/rollout/loss blocks; per-arm overrides in arm_profiles.
#
# Launch: see main/docs/launch_training.md (canonical for agents).
#   bash main/scripts/launch_train.sh --mode full --gpu-class b200 --arm grpo
#   bash main/scripts/launch_train.sh --mode full --gpu-class h200 --arm minority_answer
#
# Legacy per-arm yaml files are shims only (arm: <name> → merges this file).
# Requires /vol/data/polaris_train.jsonl on main-artifacts.

global_seed: 42
operator: nancy
gpu_class: H200
modal_price_per_sec: 0.001261
arm: grpo
prompt_variant: hybrid_answer_boxed

# Clustering for set arms (minority_answer, poly_epo_answer).
# Production default: hardened canonicalize + sympy union-find with allowlist gate.
# `sympy_mode`: allowlist (default — vetted commands only, fails closed on unknowns)
#             | blocklist (sympy by default, skip known-unsafe; legacy v1)
#             | off       (canonicalize only)
# Selected from the 2026-05-26 clustering ablation on smoke rollouts; see
# docs/build_spec/answer_clustering.md and docs/timeline.md for the decision +
# documented limitations.
clustering:
  sympy_mode: allowlist

train:
  data_path: /vol/data/polaris_train.jsonl
  total_steps: 799
  batch_size: 64
  n_rollouts: 8
  microbatch: 64
  token_budget: 130000  # B200 minority smoke au96bwh1: ~161 GB peak, 4 chunks, ~8% faster vs 105k
  grad_accum: 1
  lr: 1.0e-6
  weight_decay: 0.0
  grad_clip: 1.0
  gradient_checkpointing: true
  checkpoint_every_steps: 20
  resume: auto

rollout:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  temperature: 1.0
  top_p: 1.0
  gpu_memory_utilization: 0.45
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true
  logprobs: 1

loss:
  clip_low: 0.20
  clip_high: 0.28
  entropy_coef: 0.0

weight_sync:
  every_n_steps: 1

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
  hf_cache_volume: hf-cache

wandb:
  entity: 224r-project
  project: cs224r-minority-voting

# Per-arm: checkpoint dir, wandb group, length_norm (set arms → batch_max enforced
# in TrainCfg.from_dict). Only keys that differ from shared blocks above.
# train.checkpoint_dir = family name (e.g. train_real). Launches write
# /vol/checkpoints/{family}_{run_id}/step_*.pt (run_id = CS224R_APP_NAME).
arm_profiles:
  grpo:
    train:
      checkpoint_dir: /vol/checkpoints/train_real/
    loss:
      length_norm: per_seq
    artifacts:
      pointer_path: docs/artifacts/train_real.pointer.json
    wandb:
      group: train-real

  minority_answer:
    arm: minority_answer
    train:
      checkpoint_dir: /vol/checkpoints/train_minority_answer/
    loss:
      length_norm: batch_max
    artifacts:
      pointer_path: docs/artifacts/train_minority_answer.pointer.json
    wandb:
      group: train-minority-answer

  poly_epo_answer:
    arm: poly_epo_answer
    train:
      checkpoint_dir: /vol/checkpoints/train_poly_epo_answer/
    loss:
      length_norm: batch_max
    artifacts:
      pointer_path: docs/artifacts/train_poly_epo_answer.pointer.json
    wandb:
      group: train-poly-epo-answer

  minority_cot:
    arm: minority_cot
    train:
      checkpoint_dir: /vol/checkpoints/train_minority_cot/
    loss:
      length_norm: batch_max
    artifacts:
      pointer_path: docs/artifacts/train_minority_cot.pointer.json
    wandb:
      group: train-minority-cot

# Smoke only: append all rollouts each step for offline clustering / answer-matching
# probes ({arm} substituted at launch). Not used on full production runs.
smoke_probes:
  rollouts_jsonl_path: /vol/probes/05-26/{arm}_smoke/train_rollouts.jsonl
