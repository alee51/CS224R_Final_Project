# DAPO 2k pass@8: base + latest B200 ckpt per arm with train-matched hybrid prompt.
#
# Launch (anastasia profile, from repo root):
#   main/.venv/bin/modal profile activate anastasia
#   bash main/scripts/launch_checkpoint_eval.sh \
#     --config main/configs/checkpoint_eval_2k_dapo_hybrid_arms_latest_b200.yaml --detach

operator: anastasia
gpu_class: B200
global_seed: 42
modal_price_per_sec: 0.001736

eval:
  include_base: true
  n_rollouts: 8
  rollout_chunk_prompts: 64
  output_dir: /vol/probes/checkpoint_eval_2k_dapo_hybrid_arms_latest

  checkpoint_variants:
    - label: grpo_b200_s299
      path: /vol/checkpoints/train_real_b200/step_000299.pt
    - label: minority_b200_s133
      path: /vol/checkpoints/train_minority_answer_b200/step_000133.pt
    - label: poly_epo_b200_s133
      path: /vol/checkpoints/train_poly_epo_answer_b200/step_000133.pt

  datasets:
    dapo:
      kind: hf
      hf_dataset: open-r1/DAPO-Math-17k-Processed
      hf_config: en
      hf_split: train
      n_prompts: 2000
      seed: 43
      prompt_variant: hybrid_answer_boxed

rollout:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  temperature: 1.0
  top_p: 1.0
  gpu_memory_utilization: 0.45
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true
  logprobs: 1

train:
  lr: 1.0e-6
  weight_decay: 0.0
  gradient_checkpointing: false

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
