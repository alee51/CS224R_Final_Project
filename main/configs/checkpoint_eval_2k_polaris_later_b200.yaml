# Polaris 2k eval on later training checkpoints (no base re-run).
# Runs on Anastasia's Modal workspace (checkpoints + polaris_train.jsonl already on volume).
# Same slice as prior 2k eval: seed 42, n_prompts=2000, hybrid_answer_boxed.
#
# Launch (from repo root, anastasia profile active):
#   main/.venv/bin/modal profile activate anastasia
#   bash main/scripts/launch_checkpoint_eval.sh --config main/configs/checkpoint_eval_2k_polaris_later_b200.yaml --detach

operator: anastasia
gpu_class: B200
global_seed: 42
modal_price_per_sec: 0.001736

eval:
  include_base: false
  checkpoint_dir: /vol/checkpoints/train_real/
  checkpoint_steps: [239, 339]
  n_rollouts: 8
  rollout_chunk_prompts: 64
  output_dir: /vol/probes/checkpoint_eval_2k_polaris_later

  datasets:
    polaris:
      kind: jsonl
      path: /vol/data/polaris_train.jsonl
      n_prompts: 2000
      seed: 42
      prompt_variant: hybrid_answer_boxed

rollout:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  temperature: 1.0
  top_p: 1.0
  gpu_memory_utilization: 0.45
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true
  logprobs: 1

train:
  lr: 1.0e-6
  weight_decay: 0.0
  gradient_checkpointing: false

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
