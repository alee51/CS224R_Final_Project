# Large fixed-slice checkpoint eval: 2k Polaris + OOD (DAPO + AIME-25).
# 4× H200 in parallel (one checkpoint per GPU). Launch:
#   bash main/scripts/launch_checkpoint_eval.sh --config main/configs/checkpoint_eval_2k.yaml

operator: nancy
gpu_class: H200
global_seed: 42
modal_price_per_sec: 0.001261

eval:
  checkpoint_dir: /vol/checkpoints/train_real/
  checkpoint_steps: [49, 99, 149]
  n_rollouts: 8
  rollout_chunk_prompts: 64
  output_dir: /vol/probes/checkpoint_eval_2k

  datasets:
    polaris:
      kind: jsonl
      path: /vol/data/polaris_train.jsonl
      n_prompts: 2000
      seed: 42
      prompt_variant: hybrid_answer_boxed

    dapo:
      kind: hf
      hf_dataset: open-r1/DAPO-Math-17k-Processed
      hf_config: en
      hf_split: train
      n_prompts: 2000
      seed: 43
      prompt_variant: dapo_answer_v1

    aime25:
      kind: jsonl
      # Bundled in image at main/data/eval/aime25.jsonl (MathArena/aime_2025, 30 problems).
      path: /vol/data/eval/aime25.jsonl
      n_prompts: 30
      seed: 0
      prompt_variant: dapo_answer_v1

rollout:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  temperature: 1.0
  top_p: 1.0
  gpu_memory_utilization: 0.45
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true
  logprobs: 1

train:
  lr: 1.0e-6
  weight_decay: 0.0
  gradient_checkpointing: false

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
