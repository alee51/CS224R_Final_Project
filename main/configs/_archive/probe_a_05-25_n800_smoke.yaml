global_seed: 42
operator: nancy
gpu_class: H100
modal_price_per_sec: 0.001097

smoke: true
smoke_per_band: 1
smoke_n_rollouts: 2

resume_from_phase: null

sampling:
  per_band: 100
  difficulty_bands: ["0/8", "1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8"]
  rollouts_per_prompt: 8
  temperature: 1.0

phase1:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  gpu_memory_utilization: 0.90
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true

phase2:
  model: Qwen/Qwen3-4B-Instruct-2507
  gpu_memory_utilization: 0.88
  max_model_len: 32768
  max_num_seqs: 4
  temperature: 0.0
  max_tokens: 1024
  apply_chat_template: true

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
  hf_cache_volume: hf-cache
  manifest_path: probes/05-25/group_a_n800/manifest.jsonl
  rollouts_path: probes/05-25/group_a_n800/phase1_rollouts.jsonl
  phase1_done_path: probes/05-25/group_a_n800/phase1_done.json
  pointer_path: docs/probes/artifacts/05-25_group_a_n800.pointer.json

wandb:
  entity: 224r-project
  project: cs224r-minority-voting
  group: probe-A-05-25-n800
