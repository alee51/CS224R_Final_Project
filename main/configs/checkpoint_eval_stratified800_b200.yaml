# Equal stratification: 100 prompts per difficulty_band (800 total).
# Same train pool as polaris_train.jsonl; base + three B200 arms.
# report_by_band should show ~100 per band with pass@8 per band.
#
# Build manifest (once):
#   python main/scripts/build_polaris_random_manifest.py --stratified --per-band 100 --seed 42
#
# Launch:
#   bash main/scripts/launch_checkpoint_eval.sh \
#     --config main/configs/checkpoint_eval_stratified800_b200.yaml --detach

operator: anastasia
gpu_class: B200
global_seed: 42
modal_price_per_sec: 0.001736

eval:
  include_base: true
  report_by_band: true
  n_rollouts: 8
  rollout_chunk_prompts: 64
  output_dir: /vol/probes/checkpoint_eval_stratified800_b200

  checkpoint_variants:
    - label: grpo_b200_s299
      path: /vol/checkpoints/train_real_b200/step_000299.pt
    - label: minority_b200_s133
      path: /vol/checkpoints/train_minority_answer_b200/step_000133.pt
    - label: poly_epo_b200_s133
      path: /vol/checkpoints/train_poly_epo_answer_b200/step_000133.pt

  datasets:
    polaris_stratified800:
      kind: jsonl
      path: /root/main/data/probes/05-27/polaris_stratified800/manifest.jsonl
      use_all_rows: true
      n_prompts: 800
      seed: 42
      prompt_variant: hybrid_answer_boxed

rollout:
  model: Qwen/Qwen3-1.7B-Base
  max_prompt_length: 1024
  max_response_length: 4096
  temperature: 1.0
  top_p: 1.0
  gpu_memory_utilization: 0.45
  max_model_len: 5120
  max_num_seqs: 128
  enable_prefix_caching: true
  logprobs: 1

train:
  lr: 1.0e-6
  weight_decay: 0.0
  gradient_checkpointing: false

artifacts:
  volume_name: main-artifacts
  volume_mount: /vol
